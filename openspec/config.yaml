schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

context: |
  Proyecto: Sistema de Registro y Control de Mermas – Yogufrut.
  Reemplaza el registro de mermas por WhatsApp con una plataforma web centralizada.
  Requerimientos completos: docs/requerimientos.md. Mockup: docs/mockup-panel-reportes.png.
  Tech stack: Next.js 16 (TypeScript) + SQLite vía libsql y Drizzle (archivo local; compatible con Turso).
  Montos como enteros: costos en centavos, cantidades en milésimas. Fechas en ms UTC, mostradas en America/Monterrey.
  Roles (4): empleado, encargado de turno, gerente, administrador general.
  Cada usuario pertenece a una sucursal; solo el administrador ve todas.
  Navegadores objetivo: Chrome y Edge.
  Idioma de UI y documentación: español.
  Commits: conventional commits, sin atribución de IA.

rules:
  tasks:
    - Organizar las tareas en fases verticales (end-to-end), no por capas técnicas.
    - La fase 1 debe permitir recorrer el flujo principal de punta a punta (UI → servidor → base de datos → UI) funcionando.
    - Cada fase siguiente agrega funcionalidad completa y verificable sobre un flujo que ya funciona.
    - Cada fase termina con una verificación manual del flujo descrita como tarea.
